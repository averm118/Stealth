name: Scrape company careers jobs

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company name or scraper id"
        required: false
        type: string
  schedule:
    - cron: "30 8 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/job_scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run allowlisted career-page scraper
        env:
          INGEST_ADMIN_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
          STEALTH_APP_URL: ${{ secrets.STEALTH_APP_URL }}
          SCRAPER_BATCH_SIZE: "25"
          SCRAPER_LIMIT_PER_COMPANY: "60"
        run: |
          COMPANY_ARG=""
          if [ -n "${{ inputs.company }}" ]; then
            COMPANY_ARG="--company ${{ inputs.company }}"
          fi

          python scripts/job_scraper/run.py \
            $COMPANY_ARG \
            --post-url "$STEALTH_APP_URL/api/jobs/import-scraped" \
            --token "$INGEST_ADMIN_TOKEN" \
            --output scraped-jobs.json

      - name: Upload scraper payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-jobs
          path: scraped-jobs.json
          if-no-files-found: ignore
