name: Scrape company careers jobs

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company name or scraper id"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/job_scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run allowlisted career-page scraper
        env:
          INGEST_ADMIN_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
          STEALTH_APP_URL: ${{ secrets.STEALTH_APP_URL }}
          SCRAPER_BATCH_SIZE: "30"
          SCRAPER_LIMIT_PER_COMPANY: "90"
          SCRAPER_SHARD_INDEX: ${{ matrix.shard }}
          SCRAPER_SHARD_TOTAL: "4"
        run: |
          COMPANY_ARG=""
          if [ -n "${{ inputs.company }}" ]; then
            COMPANY_ARG="--company ${{ inputs.company }}"
          fi

          python scripts/job_scraper/run.py \
            $COMPANY_ARG \
            --shard-index "$SCRAPER_SHARD_INDEX" \
            --shard-total "$SCRAPER_SHARD_TOTAL" \
            --batch-size "$SCRAPER_BATCH_SIZE" \
            --limit-per-company "$SCRAPER_LIMIT_PER_COMPANY" \
            --post-url "$STEALTH_APP_URL/api/jobs/import-scraped" \
            --token "$INGEST_ADMIN_TOKEN" \
            --output "scraped-jobs-shard-$SCRAPER_SHARD_INDEX.json"

      - name: Upload scraper payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-jobs-shard-${{ matrix.shard }}
          path: scraped-jobs-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
